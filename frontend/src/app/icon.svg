<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Main Dimensional Medical Gradient -->
    <linearGradient id="drgodly-fav-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="40%" stop-color="#2563EB" />
      <stop offset="78%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Frosted Glass Top Bezel Highlight -->
    <linearGradient id="drgodly-fav-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.6" />
    </linearGradient>

    <!-- Inner Vital Core Radial Glow -->
    <radialGradient id="drgodly-fav-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="55%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </radialGradient>
  </defs>

  <!-- 1. Rounded Squircle Clinical Shield Base -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#drgodly-fav-base)" />
  <rect x="7.5" y="7.5" width="85" height="85" rx="24.5" stroke="url(#drgodly-fav-rim)" stroke-width="2" />

  <!-- 2. Precision Embedded White Medical Cross -->
  <rect x="36" y="22" width="28" height="56" rx="8" fill="#FFFFFF" />
  <rect x="22" y="36" width="56" height="28" rx="8" fill="#FFFFFF" />

  <!-- 3. Vital AI Center Core -->
  <circle cx="50" cy="50" r="7.5" fill="url(#drgodly-fav-core)" />
  <circle cx="50" cy="50" r="3.2" fill="#FFFFFF" />

  <!-- 4. Ambient 4-Point AI Intelligence Sparkle -->
  <path d="M80 16 C80 21 84 22 84 22 C84 22 80 23 80 28 C80 23 76 22 76 22 C76 22 80 21 80 16 Z" fill="#38BDF8" />
  <circle cx="80" cy="22" r="1.2" fill="#FFFFFF" />
</svg>
