<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Main Dimensional Medical Gradient -->
    <linearGradient id="drgodly-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="40%" stop-color="#2563EB" />
      <stop offset="78%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Frosted Glass Top Bezel Highlight -->
    <linearGradient id="drgodly-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.5" />
    </linearGradient>

    <!-- Inner Vital Core Radial Glow -->
    <radialGradient id="drgodly-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="55%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </radialGradient>

    <!-- Subtle Ambient Soft Shadow -->
    <filter id="drgodly-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1D4ED8" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 1. Rounded Squircle Clinical Shield Base -->
  <rect
    x="7"
    y="7"
    width="86"
    height="86"
    rx="25"
    fill="url(#drgodly-base)"
    filter="url(#drgodly-shadow)"
  />

  <!-- 2. Frosted Inner Rim Border -->
  <rect
    x="8.5"
    y="8.5"
    width="83"
    height="83"
    rx="23.5"
    stroke="url(#drgodly-rim)"
    stroke-width="1.75"
  />

  <!-- 3. Embedded Precision White Medical Cross with Pill Ends -->
  <rect x="36" y="23" width="28" height="54" rx="8" fill="#FFFFFF" />
  <rect x="23" y="36" width="54" height="28" rx="8" fill="#FFFFFF" />

  <!-- 4. Central Vital Pulse Node -->
  <circle cx="50" cy="50" r="7.5" fill="url(#drgodly-core)" />
  <circle cx="50" cy="50" r="3.2" fill="#FFFFFF" />

  <!-- 5. Ambient 4-Point AI Intelligence Sparkle -->
  <path
    d="M79 17 C79 21.5 83 22.5 83 22.5 C83 22.5 79 23.5 79 28 C79 23.5 75 22.5 75 22.5 C75 22.5 79 21.5 79 17 Z"
    fill="#38BDF8"
  />
  <circle cx="79" cy="22.5" r="1.2" fill="#FFFFFF" />
</svg>
